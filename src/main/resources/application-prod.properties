spring.application.name=documentChatBot

# Google OAuth2 Credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile,openid

# Frontend URL
app.frontend-url=${FRONTEND_URL}

# Logging and Management
logging.file.name=${LOG_FILE:logs/document-chatbot.log}
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never

# MongoDB Configuration
spring.mongodb.uri=${SPRING_MONGODB_URI}
spring.data.mongodb.auto-index-creation=false

# File Upload Limits
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# Redis / Upstash Cache
spring.data.redis.host=${UPSTASH_REDIS_HOST}
spring.data.redis.port=${UPSTASH_REDIS_PORT:6379}
spring.data.redis.password=${UPSTASH_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# Mistral AI
spring.ai.mistralai.api-key=${MISTRAL_API_KEY}
spring.ai.mistralai.chat.options.model=${MISTRAL_MODEL:mistral-large-latest}
spring.ai.mistralai.chat.options.temperature=${MISTRAL_TEMPERATURE:0.2}
app.mistral.base-url=${MISTRAL_BASE_URL:https://api.mistral.ai}

# Document Parser & Vector Store
app.markitdown.url=${MARKITDOWN_URL}
app.markitdown.timeout-seconds=${MARKITDOWN_TIMEOUT_SECONDS:120}
upstash.vector.url=${UPSTASH_VECTOR_URL}
upstash.vector.token=${UPSTASH_VECTOR_TOKEN}

# RAG & Rate Limiting Parameters
app.rag.chunk-size=${RAG_CHUNK_SIZE:800}
app.rag.chunk-overlap=${RAG_CHUNK_OVERLAP:150}
app.rag.top-k=${RAG_TOP_K:4}
app.rate-limit.per-minute=${RATE_LIMIT_PER_MINUTE:60}

# Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true