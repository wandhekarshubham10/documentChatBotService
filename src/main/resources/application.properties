spring.application.name=documentChatBot

# Activate production profile by default (or override via Render env vars)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Common File Upload Settings
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# RAG & Rate Limiting Defaults
app.rag.chunk-size=800
app.rag.chunk-overlap=150
app.rag.top-k=4
app.rate-limit.per-minute=60